# Zinc Dark style parameters. Colors are generated from tokens/tokens.json by `python -m build freecad-pack`;
# change them in build/freecad_mapping.py, not here.

# Tailwind palette
Zinc50: "#fafafa"
Zinc200: "#e4e4e7"
Zinc400: "#9f9fa9"
Zinc500: "#71717b"
Zinc600: "#52525c"
Zinc700: "#3f3f46"
Zinc800: "#27272a"
Zinc900: "#18181b"
Zinc915: "#131316"
Zinc935: "#0d0d10"
Zinc950: "#09090b"
Rose400: "#ff637e"
Rose500: "#ff2056"
Rose600: "#ec003f"
Rose900: "#8b0836"
Red400: "#ff6467"
Red500: "#fb2c36"
Orange400: "#ff8904"
Amber400: "#ffb900"
Emerald400: "#00d492"
Sky300: "#74d4ff"
Fuchsia400: "#ed6aff"

# Semantic roles (shadcn/ui naming)
Background: "@Zinc935"
Foreground: "@Zinc200"
Card: "@Zinc915"
Popover: "@Zinc900"
Muted: "@Zinc915"
MutedForeground: "@Zinc400"
Subtle: "@Zinc500"
Disabled: "@Zinc600"
Accent: "@Zinc800"
AccentStrong: "@Zinc700"
Border: "@Zinc700"
BorderStrong: "@Zinc600"
Input: "@Zinc900"
Ring: "@Rose500"
Primary: "@Rose500"
PrimaryHover: "@Rose400"
PrimaryForeground: "@Zinc50"
Tooltip: "@Zinc900"
TooltipForeground: "@Zinc200"
Selection: "@Rose900"
SelectionStrong: "@Rose600"
Brand: "@Rose500"
Link: "@Rose400"
Destructive: "@Red500"
Radius: "6px"
RadiusLarge: "8px"
RadiusSmall: "4px"

# Sketcher solver messages
SketcherEmptySketchColor: "@Zinc400"
SketcherUnderConstrainedColor: "@Zinc50"
SketcherFullyConstrainedColor: "@Emerald400"
SketcherConflictingConstraintsColor: "@Red400"
SketcherMalformedConstraintsColor: "@Red400"
SketcherSolverFailedColor: "@Red400"
SketcherRedundantConstraintsColor: "@Orange400"
SketcherPartiallyRedundantConstraintsColor: "@Sky300"
SketcherRubberbandTouchSelectionColor: "@Emerald400"
SketcherRubberbandWindowSelectionColor: "@Rose500"

# Part Design previews and 3D gizmos
PreviewAdditiveColor: "@Emerald400"
PreviewSubtractiveColor: "@Red500"
PreviewCommonColor: "@Amber400"
PreviewDressUpColor: "@Fuchsia400"
PreviewErrorColor: "@Red500"
LinearGizmoActiveColor: "@Amber400"
RotationGizmoActiveColor: "@Amber400"
DimensionVisualizerColor: "@Rose400"

# Aliases for FreeCAD's standard tokens, used by the built-in overlay stylesheet and addons
PrimaryColor: "@Background"
TextForegroundColor: "@Foreground"
TextDisabledColor: "@Disabled"
TextUrlColor: "@Link"
TextEditFieldBackgroundColor: "@Input"
TextSelectBackgroundColor: "@SelectionStrong"
GeneralBackgroundColor: "@Background"
GeneralAlternateBackgroundColor: "@Muted"
GeneralBackgroundHoverColor: "@Accent"
GeneralBorderColor: "@Border"
GeneralBorderHoverColor: "@BorderStrong"
GeneralDisabledBackgroundColor: "@Muted"
GeneralGridLinesColor: "@Border"
GeneralHeaderBackgroundColor: "@Muted"
DialogBackgroundColor: "@Background"
MenuBackgroundColor: "@Popover"
ButtonTopBackgroundColor: "@Input"
ButtonBottomBackgroundColor: "@Input"
AccentColor: "@Brand"
AccentBackgroundColor: "@Selection"
AccentHoverColor: "@Accent"
3DViewBackgroundRefColor: "@Zinc950"
ActiveTabBackgroundColor: "@Background"
InActiveTabBackgroundColor: "@Background"
IconsLocationFolderName: "images_classic"
StylesheetIconsColor: "white"
InputFieldBorderRadius: "@Radius"
ToolbarButtonsPadding: "4px"
